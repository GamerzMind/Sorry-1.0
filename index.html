  <style>
    /* ---------- smooth day / night switch ---------- */
    @property --dark-color {
      syntax: "<color>";
      inherits: true;
      initial-value: #000;
    }
    :root { transition: --dark-color 1.2s ease; }
    body { transition: background-color 1.2s ease; }

    /* daytime sky sits on top of the night sky and fades in */
    .day {
      position: fixed; inset: 0;
      opacity: 0; pointer-events: none;
      transition: opacity 1.2s ease;
      background-image:
        radial-gradient(ellipse at top, rgba(255, 255, 255, 0.9), transparent 60%),
        radial-gradient(circle at 50% 35%, rgba(255, 214, 224, 0.9), transparent 55%),
        radial-gradient(ellipse at bottom, rgba(167, 255, 238, 0.35), transparent 60%),
        linear-gradient(180deg, #fff1f5 0%, #ffe9e2 45%, #eafcf8 100%);
    }

    /* light mode */
    html.light { --dark-color: #fff4f1; }
    html.light .day { opacity: 1; }
    html.light .flower__grass__overlay { background-color: rgba(255, 244, 241, 0.45); }
    html.light .flower__leafs::after { background-color: #ffb3c7; }
    html.light .flower__light { filter: blur(0.1vmin) saturate(1.4); }
    html.light .flower__light:nth-child(even) { background-color: #ffb347; }
    html.light .flower__light:nth-child(odd) { background-color: #ff7eb3; }

    /* theme toggle */
    .theme-btn {
      position: fixed; top: 16px; left: 16px; z-index: 999;
      width: 46px; height: 46px; border-radius: 50%;
      border: 1px solid #39c6d6; background: rgba(0, 0, 0, 0.5);
      font-size: 20px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.6s, border-color 0.6s, transform 0.2s;
    }
    .theme-btn:active { transform: scale(0.9); }
    html.light .theme-btn,
    html.light .music-btn {
      background: rgba(255, 255, 255, 0.7);
      border-color: #ff9fbd;
      color: #d6457a;
    }
  </style>
</head>
